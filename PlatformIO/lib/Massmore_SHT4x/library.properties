sentence=Driver for Sensirion SHT40 / SHT41 / SHT45 temperature & humidity sensors on the Massmore SHT4X board (SKU-1022).
paragraph=Simple Blocking API + Non-blocking FSM, zero heap, no hardcoded pins, 6 heater modes with duty-cycle guard, serial number + authenticity check, factory test sketch. Supports ESP32 / ESP32-S3 (Arduino-ESP32 Core 3.x) and Arduino Nano (ATmega328P).
